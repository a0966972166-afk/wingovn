<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNWIN CRYPTO</title>
    <style>
        body { background-color: #0b0b0b; color: #fff; font-family: Arial, sans-serif; text-align: center; padding-top: 20%; }
        .loading { font-size: 20px; color: #ffca28; font-weight: bold; }
    </style>
    <script>
        // 您的 H5 推廣主網址
        const targetUrl = "https://wingo.life";

        window.onload = function() {
            // 自動捕捉 Adsterra 傳過來的所有成效追蹤參數
            const urlParams = window.location.search;
            const finalUrl = targetUrl + (urlParams ? urlParams.replace('?', '&') : '');
            
            // 延遲 0.5 秒後自動執行隱形跳轉
            setTimeout(function() {
                window.location.href = finalUrl;
            }, 500);
        }
    </script>
</head>
<body>
    <div class="loading">Đang kết nối đến cổng game SUNWIN...</div>
    <p>Vui lòng đợi trong giây lát...</p>
</body>
</html>
